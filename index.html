<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kompass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);height:100%}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Kompass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --surface2:#EEECE7; --line:#E0DDD5;
  --text:#0C0C0B; --muted:#5D5B55; --gold:#8A6718; --gold-fill:#C9A24B; --on-gold:#0C0C0B;
  --gold-soft:rgba(201,162,75,.16); --danger:#A1301D;
  --display:"Syne","Avenir Next",system-ui,sans-serif; --body:"Manrope","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#151515; --surface2:#1F1F1E; --line:#2B2A28;
    --text:#F4F3EF; --muted:#9C9A92; --gold:#D6B25E; --gold-fill:#C9A24B; --on-gold:#0A0A0A;
    --gold-soft:rgba(214,178,94,.14); --danger:#F0806B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#151515; --surface2:#1F1F1E; --line:#2B2A28;
  --text:#F4F3EF; --muted:#9C9A92; --gold:#D6B25E; --gold-fill:#C9A24B; --on-gold:#0A0A0A;
  --gold-soft:rgba(214,178,94,.14); --danger:#F0806B; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#view{flex:1;overflow-y:auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.tabbar{flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:48px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tabbar button[aria-current="page"]{color:var(--gold)}
.tabbar svg{width:23px;height:23px}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
h3{font-size:15px;margin:0;font-weight:700}
.head{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.small{font-size:13px}
.tiny{font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hero{background:var(--text);color:var(--bg);border-color:var(--text)}
.card.hero .muted{color:color-mix(in srgb,var(--bg) 62%,var(--text))}
.card.tight{padding:12px}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted)}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}

.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gold-fill)}
.bar.alt i{background:var(--text)}
.hero .bar{background:color-mix(in srgb,var(--bg) 18%,var(--text))}
.hero .bar i{background:var(--gold-fill)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.btn.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.ghost{background:none;border-color:transparent;color:var(--gold);padding:0 6px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px;border-radius:10px}
.btn svg{flex-shrink:0}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{color:var(--gold)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted)}
button.item{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding:10px 2px;color:var(--text)}
button.item:first-child{border-top:0}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:36px;padding:0 14px;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--text);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.done{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:38px;font-weight:700;font-size:13px;color:var(--muted);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:46px;padding:0 12px;font-size:16px;color:var(--text)}
textarea.input{padding:10px 12px;min-height:90px}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:110px}
.input:focus{border-color:var(--gold);outline:none}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--surface2);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--gold-fill)}
.switch[aria-checked="true"]::after{left:23px}

.ringwrap{position:relative;width:132px;height:132px;flex-shrink:0}
.ringwrap svg{width:132px;height:132px;transform:rotate(-90deg)}
.ringwrap .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringwrap .c b{font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:800}
.mac{display:flex;flex-direction:column;gap:5px}
.mac .row{font-size:13px}

.meal .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.datenav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.datenav b{font-size:15px}

.tl{display:flex;flex-direction:column}
.tl .st{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;align-items:start;padding:6px 0}
.tl .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:5px;border:2px solid var(--gold-fill);margin-top:5px}
.tl .st.now .dot{background:var(--gold-fill)}
.tl .st.past{opacity:.5}
.tl .tx b{display:block;font-size:14px}
.tl .tx span{font-size:13px;color:var(--muted);display:block}

.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sched .dh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.04em}
.sched button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;color:var(--text)}
.sched button b{font-size:16px;font-family:var(--display)}
.sched button span{font-size:10px;color:var(--muted)}
.sched button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.sched button.on span{color:color-mix(in srgb,var(--bg) 65%,var(--text))}
.sched button.today{box-shadow:inset 0 0 0 2px var(--gold-fill)}

.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;color:var(--text)}
.scale button[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.scalelbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.sets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sets th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:0 4px 6px}
.sets td{padding:4px}
.sets td:first-child{width:28px;color:var(--muted);font-weight:700;text-align:center}
.sets .input{min-height:40px;padding:0 8px;text-align:center}
.sets tr.done .input{border-color:var(--gold-fill);background:var(--gold-soft)}
.check{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0}
.check[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.check svg{width:18px;height:18px}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--surface2);object-fit:cover;flex-shrink:0}
.thumbph{width:48px;height:48px;border-radius:10px;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:7px;border:2px solid var(--gold-fill)}
.dots i.f{background:var(--gold-fill)}

.banner{border:1px dashed var(--gold);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px}
.tip{display:flex;gap:10px;font-size:14px}
.tip::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--gold-fill);margin-top:8px;flex-shrink:0}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 2px;color:var(--text)}
.menu button:first-child{border-top:0}
.menu .grow{flex:1}
.menu b{display:block;font-size:15px}
.menu span.s{font-size:13px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photos figure{margin:0}
.photos img,.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--surface2);display:block;max-width:100%}
.photos figcaption,.compare figcaption{font-size:11px;color:var(--muted);text-align:center;padding-top:3px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.compare figure{margin:0}
.player{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.player .big{font-family:var(--display);font-weight:800;font-size:64px;font-variant-numeric:tabular-nums;line-height:1}
.player img{width:100%;max-width:320px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--surface2)}

#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .panel{position:relative;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;animation:up .22s ease-out}
#sheet .phd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:8px}
#sheet .pbody{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#sheet .panel{animation:none}.switch::after{transition:none}}
.video{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:16px;background:#000;object-fit:cover}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.breath{width:200px;height:200px;border-radius:50%;background:var(--gold-soft);border:2px solid var(--gold-fill);display:flex;align-items:center;justify-content:center;transform:scale(.6);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1);transition-duration:4s}
.breath.out{transform:scale(.6);transition-duration:6s}
.breath b{font-family:var(--display);font-size:20px}
@media (prefers-reduced-motion: reduce){.breath,.breath.in,.breath.out{transition:none;transform:none}}
.win{display:flex;flex-direction:column;gap:2px}
.win b{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;color:var(--gold)}
.hero .win b{color:var(--gold-fill)}
.quote{font-size:16px;line-height:1.5;border-left:0;padding:0}
.help b{font-variant-numeric:tabular-nums;user-select:all}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
</style>

<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Hauptnavigation">
    <button type="button" data-act="tab" data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
    <button type="button" data-act="tab" data-tab="essen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M9 7c0-2 1.5-3 3-3M15 7c0-1.5-1-2.5-2-3"/></svg>Essen</button>
    <button type="button" data-act="tab" data-tab="training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12M3 9v6M18 6v12M21 9v6M6 12h12"/></svg>Training</button>
    <button type="button" data-act="tab" data-tab="koerper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>Körper</button>
    <button type="button" data-act="tab" data-tab="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Mehr</button>
  </nav>
</div>
<div id="sheet" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="phd"><h2 id="sheetTitle"></h2><button type="button" class="iconbtn" data-act="closeSheet" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="pbody" id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  for (let i=20;i>=1;i--) {

    const sleep = sh==='nacht' ? 2+Math.round(R()*2) : 3+Math.round(R()*2);
    const stress = sh==='montage' ? 3+Math.round(R()*2) : 1+Math.round(R()*3);
    const trained = ['frei','spaet'].includes(sh) ? R()<0.6 : R()<0.3;

    if (stress>=4 && R()<0.5) addF(k,'snacks',RD('Nussmischung'));
    day(k).water = 1500 + Math.round(R()*7)*250;
    const energy = Math.max(1,Math.min(5, Math.round(sleep*0.6 + (trained?1:0) + (day(k).water>=2500?0.5:0) + R()*0.8 - 0.3)));
    s.checkins[k] = {energy, mood:Math.max(1,Math.min(5,energy+Math.round(R()*2-1))), stress, sleep, note:''};
    s.habitLog[k] = s.habits.filter(()=>R()<0.65).map(h=>h.id);
    if (trained) {
      const tp = pick(['push','pull','legs']);

      s.workouts.push({id:uid(),date:k,name:{push:'Oberkörper Push',pull:'Oberkörper Pull',legs:'Unterkörper'}[tp],ex:W.map(([id,kg,reps])=>({exId:id,name:exName(EXBY[id]),sets:[0,1,2].map(j=>({kg,reps:reps-(j===2?1:0),done:true}))}))});

/* ================= Rechnen ================= */
function entryFrom(f,g){ return {id:uid(),name:f.name,g:Math.round(g),kcal:f.kcal,p:f.p,c:f.c,f:f.f,fid:f.id}; }
const eK = e => e.kcal*e.g/100, eP = e => e.p*e.g/100, eC = e => e.c*e.g/100, eF = e => e.f*e.g/100;
function totals(k){ const d = state.days[k]; const t = {kcal:0,p:0,c:0,f:0,n:0}; if(!d) return t; MEALS.forEach(([m])=> (d.meals[m]||[]).forEach(e=>{t.kcal+=eK(e);t.p+=eP(e);t.c+=eC(e);t.f+=eF(e);t.n++;})); return t; }
function sortedWeights(){ return [...state.weights].sort((a,b)=>a.date<b.date?-1:1); }
function latestWeight(){ const w = sortedWeights(); return w.length ? w[w.length-1].kg : null; }
function targets(){
  const p = state.profile, w = latestWeight() || p.weight;
  const bmr = 10*w + 6.25*p.height - 5*p.age + (p.sex==='w' ? -161 : 5);
  const tdee = bmr * p.activity;
  const adj = p.goal==='lose' ? -500 : p.goal==='gain' ? 300 : 0;
  const kcal = Math.round((tdee+adj)/10)*10;
  const prot = Math.round((p.goal==='keep'?1.8:2.0)*w);
  const fat = Math.round(kcal*0.25/9);
  const carb = Math.max(0, Math.round((kcal - prot*4 - fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,p:prot,f:fat,c:carb};
}
const hk = () => !!state.profile.hideKcal;
function allFoods(){ return [...state.foods, ...RECIPE_FOODS, ...BASIC_FOODS, ...ROAD_FOODS]; }
function findFood(id){ return allFoods().find(f=>f.id===id); }
function shiftOf(k){ return state.work.sched[k] || 'frei'; }
function logged(k){ const d = state.days[k]; return (d && MEALS.some(([m])=>(d.meals[m]||[]).length>0)) || !!state.checkins[k] || state.jokers.includes(k); }
function streak(){ let k = today(); if (!logged(k)) k = addDays(k,-1); let n = 0; while (logged(k) && n<1000) { n++; k = addDays(k,-1); } return n; }
function jokerFree(){ const ws = weekStart(today()); return !state.jokers.some(j=>j>=ws); }
function weekTrainings(){ const ws = weekStart(today()); return new Set(state.workouts.filter(w=>w.date>=ws).map(w=>w.date)).size; }
function habitDone(k,id){ return (state.habitLog[k]||[]).includes(id); }
function habitStreak(id){ let k = today(); if (!habitDone(k,id)) k = addDays(k,-1); let n=0; while (habitDone(k,id) && n<1000){ n++; k = addDays(k,-1); } return n; }
const e1rm = (kg,reps) => num(kg)*(1+num(reps)/30);

/* Wochenplan automatisch füllen (Schicht beachten) */
function autoFillPlan(){
  const t = today();
  for (let i=0;i<7;i++) {
    const k = addDays(t,i), sh = shiftOf(k); state.plan[k] = state.plan[k] || {};
    const P = state.plan[k], road = sh==='montage', night = sh==='nacht';
    if (!P.fruehstueck) P.fruehstueck = road||night ? (i%2?'quark':'oats') : ['oats','ruehrei','quark'][i%3];
    if (!P.mittag) P.mittag = road ? (i%2?'wrap':'thunsalat') : ['hrb','hrb','hrb','chili','chili','wrap','thunsalat'][i];
    if (!P.abend) P.abend = night ? 'box' : road ? 'thunsalat' : ['linsen','lachs','omelett'][i%3];
    if (!P.snacks) P.snacks = i%2 ? 'huette' : 'shake';
  }
}

  const C = k => state.checkins[k];
  const add = (title,res,txt,need) => out.push(res ? {title,text:txt(res[0],res[1]),diff:Math.abs(res[0]-res[1])} : {title,need});
  add('Bewegung → Energie', cmp(ci.filter(k=>trained.has(k)).map(k=>C(k).energy), ci.filter(k=>!trained.has(k)).map(k=>C(k).energy)),
    (a,b)=>`An Tagen mit Training oder Mobility lag deine Energie bei Ø ${fmt(a,1)}, an Tagen ohne bei Ø ${fmt(b,1)}.`, 'Tage mit und ohne Bewegung');
  add('Stress → Essen', cmp(ci.filter(k=>C(k).stress>=4 && totals(k).n).map(k=>totals(k).kcal), ci.filter(k=>C(k).stress<=2 && totals(k).n).map(k=>totals(k).kcal)),
    (a,b)=>hk() ? `An stressigen Tagen hast du ${a>b?'mehr':'weniger'} gegessen als an ruhigen.` : `An stressigen Tagen hast du im Schnitt ${fmt(a)} kcal gegessen, an ruhigen ${fmt(b)} kcal.`, 'Tage mit hohem und niedrigem Stress');
  add('Schlaf → Energie', cmp(ci.filter(k=>C(k).sleep>=4).map(k=>C(k).energy), ci.filter(k=>C(k).sleep<=2).map(k=>C(k).energy)),
    (a,b)=>`Nach guten Nächten war deine Energie Ø ${fmt(a,1)}, nach schlechten Ø ${fmt(b,1)}.`, 'gute und schlechte Nächte');
  const wg = state.profile.waterGoal;
  add('Wasser → Energie', cmp(ci.filter(k=>(state.days[k]?.water||0)>=wg*0.85).map(k=>C(k).energy), ci.filter(k=>(state.days[k]?.water||0)<wg*0.6).map(k=>C(k).energy)),
    (a,b)=>`Wenn du genug getrunken hast, lag deine Energie bei Ø ${fmt(a,1)}, sonst bei Ø ${fmt(b,1)}.`, 'Tage mit viel und wenig Wasser');
  const hard = ci.filter(k=>['nacht','montage'].includes(shiftOf(k))), rest = ci.filter(k=>!['nacht','montage'].includes(shiftOf(k)));
  add('Nacht & Montage → Energie', cmp(hard.map(k=>C(k).energy), rest.map(k=>C(k).energy)),
    (a,b)=>`In Nacht- und Montagewochen lag deine Energie bei Ø ${fmt(a,1)}, sonst bei Ø ${fmt(b,1)}. Plane diese Wochen bewusst leichter.`, 'Nacht- oder Montagetage und normale Tage');
  return out.sort((a,b)=>(b.diff||0)-(a.diff||0));
}

function timeline(items, opts={}){

function haltCard(top){

  if (top && low) return `<section class="card" style="border-color:var(--gold-fill)"><div class="eyebrow gold">Schwerer Tag</div><div>Schlechte Tage löschen nicht, was du geschafft hast. Schau es dir an.</div><button type="button" class="btn primary" style="align-self:flex-start" data-act="more" data-k="halt">Deine Erfolge ansehen</button></section>`;

}

function defaultMeal(){ const h = new Date().getHours(); return h<11?'fruehstueck':h<15?'mittag':h<18?'snacks':'abend'; }
function vPlan(){

    const P = state.plan[k]||{}, sh = shiftOf(k);
    let kk=0, pp=0; MEALS.forEach(([m])=>{ const r = P[m] && RF(P[m]); if (r){ kk+=r.kcal*r.portion/100; pp+=r.p*r.portion/100; } });
    const rows = MEALS.map(([m,l])=>{ const r = P[m] && RBY[P[m]];
      return `<div class="item"><div class="grow"><div class="s">${l}</div>${r?`<button type="button" class="btn ghost" style="padding:0;min-height:30px;color:var(--text);font-weight:600;text-align:left" data-act="recipeInfo" data-id="${r.id}">${esc(r.name)}</button>`:'<div class="empty" style="padding:0">Nichts geplant</div>'}</div><button type="button" class="btn sm" data-act="pickRecipe" data-date="${k}" data-meal="${m}">${r?'Ändern':'Planen'}</button>${r?`<button type="button" class="iconbtn" data-act="unplan" data-date="${k}" data-meal="${m}" aria-label="${l} am ${esc(dayLabel(k))} entfernen">${I.x()}</button>`:''}</div>`; }).join('');

  }).join('');
  return `<div class="note">Der Plan richtet sich nach deinem Schichtplan: Nachtschicht bekommt eine kalte Box, Montagetage Rezepte ohne Küche.</div>

function shoppingList(){
  const t = today(), agg = {};
  for (let i=0;i<7;i++) { const P = state.plan[addDays(t,i)]||{}; MEALS.forEach(([m])=>{ const r = P[m] && RBY[P[m]]; if (!r) return; r.ing.forEach(([n,q])=>{ agg[n] = (agg[n]||0)+q; }); }); }
  return Object.entries(agg).map(([n,q])=>{ const f = BY_NAME[n]; let amt;
    if (PIECE[n]) amt = Math.ceil(q/(f.portion||100))+' '+PIECE[n]; else if (q>=1000) amt = fmt(q/1000,1)+' kg'; else amt = Math.round(q/10)*10+' g';
    return {name:n,amt,shelf:f?.shelf||'V'}; }).sort((a,b)=>a.name.localeCompare(b.name,'de'));

function records(){
  const best = {}, cutoff = addDays(today(),-30);
  state.workouts.forEach(w=>w.ex.forEach(x=>x.sets.forEach(s=>{ if (!num(s.kg)||!num(s.reps)) return; const v = e1rm(s.kg,s.reps); const b = best[x.exId] = best[x.exId] || {name:x.name,now:0,before:0,top:null,date:''}; if (v>b.now){ b.now=v; b.top=s; b.date=w.date; } if (w.date<cutoff && v>b.before) b.before=v; })));
  return Object.entries(best).map(([id,b])=>({id,...b})).sort((a,b)=>b.now-a.now);
}
function vRecords(){

function weightChart(){
  const ws = sortedWeights().slice(-60);
  if (ws.length < 2) return '<div class="empty">Trag mindestens zwei Werte ein, dann erscheint hier dein Verlauf.</div>';
  const W=340,H=170,L=34,R=10,T=10,Bm=24;
  const min = Math.floor(Math.min(...ws.map(w=>w.kg))-0.5), max = Math.ceil(Math.max(...ws.map(w=>w.kg))+0.5);
  const t0 = parseKey(ws[0].date).getTime(), t1 = parseKey(ws[ws.length-1].date).getTime();
  const X = d => L + (parseKey(d).getTime()-t0)/Math.max(1,t1-t0)*(W-L-R), Y = kg => T + (max-kg)/(max-min)*(H-T-Bm);
  const pts = ws.map(w=>`${X(w.date).toFixed(1)},${Y(w.kg).toFixed(1)}`).join(' ');
  const area = `${L},${H-Bm} ${pts} ${X(ws[ws.length-1].date).toFixed(1)},${H-Bm}`;
  const ticks = [min,(min+max)/2,max].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v,1)}</text>`).join('');
  const lx = X(ws[ws.length-1].date), ly = Y(ws[ws.length-1].kg);
  const dl = k => esc(parseKey(k).toLocaleDateString('de-DE',{day:'numeric',month:'short'}));
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gewichtsverlauf">${ticks}<polygon points="${area}" fill="var(--gold-soft)"/><polyline points="${pts}" fill="none" stroke="var(--gold-fill)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--gold-fill)" stroke="var(--surface)" stroke-width="2"/><text x="${L}" y="${H-6}">${dl(ws[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dl(ws[ws.length-1].date)}</text></svg></div>`;
}

function addPhoto(file){
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = async () => {
    const s = Math.min(1, 900/Math.max(img.width,img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    try { await PhotoDB.put({id:uid(),date:today(),data:c.toDataURL('image/jpeg',0.78)}); toast('Foto gespeichert'); } catch(e) { toast('Foto konnte nicht gespeichert werden'); }
    fillPhotos();
  };
  img.onerror = () => toast('Das Bild konnte nicht gelesen werden');
  img.src = url;
}

function challengeProgress(){
  const c = state.challenge; if (!c) return null;
  let done = 0, k = c.start; const end = addDays(c.start, c.days-1), t = today();
  while (k<=t && k<=end) { const ok = c.kind==='water' ? (state.days[k]?.water||0)>=state.profile.waterGoal : c.kind==='training' ? state.workouts.some(w=>w.date===k) || state.mobility.some(m=>m.date===k) : habitDone(k,c.habitId); if (ok) done++; k = addDays(k,1); }
  const elapsed = Math.min(c.days, Math.round((parseKey(t)-parseKey(c.start))/864e5)+1);
  const name = c.kind==='water' ? 'Wasserziel erreichen' : c.kind==='training' ? 'Jeden Tag bewegen' : (state.habits.find(h=>h.id===c.habitId)?.name||'Gewohnheit');
  return {done, elapsed, name, days:c.days};
}

function weekReport(){
  const t = today(), days = Array.from({length:7},(_,i)=>addDays(t,-i));
  const tr = new Set(state.workouts.filter(w=>w.date>=days[6]).map(w=>w.date)).size;
  const fk = days.filter(k=>totals(k).n), pA = avg(fk.map(k=>totals(k).p));
  const ws = sortedWeights(), lw = latestWeight(), ref = ws.filter(w=>w.date<=days[6]).pop();
  const cp = challengeProgress(), r = records().filter(x=>x.before && x.now-x.before>0.5).slice(0,2);
  return [`Meine Woche mit Kompass`, `Trainingstage: ${tr} (Ziel ${state.profile.weekGoal})`, pA!=null?`Eiweiß: Ø ${fmt(pA)} g pro Tag`:'', `Serie: ${streak()} Tage am Stück dabei`,
    lw!=null&&ref?`Gewicht: ${lw-ref.kg>0?'+':''}${fmt(lw-ref.kg,1)} kg`:'', cp?`Challenge „${cp.name}“: ${cp.done}/${cp.elapsed} Tage`:'', ...r.map(x=>`Stärker: ${x.name} +${fmt(x.now-x.before,1)} kg`)].filter(Boolean).join('\n');
}

const WHY = [['stress','Stress','Bei Stress greift der Körper zu schneller Energie. Nächstes Mal hilft es, erst 2 Minuten zu atmen oder kurz rauszugehen.'],['muede','Müde','Schlafmangel macht nachweislich hungriger. Das ist Biologie, keine Schwäche.'],['hunger','Lange nichts gegessen','Nach langen Pausen isst jeder mehr. Eine kleine Eiweiß-Mahlzeit alle 4–5 Stunden hilft, gerade auf Schicht und Montage.'],['feier','Feier oder Gesellschaft','Gemeinsam essen gehört zum Leben. Genieß es und mach morgen ganz normal weiter.'],['langeweile','Langeweile','Kurz fragen: Hunger oder Beschäftigung? Ein Glas Wasser und 10 Minuten Pause zeigen es dir.'],['frust','Frust oder Traurigkeit','Essen tröstet kurz. Wenn das öfter passiert, lohnt ein Blick in den Bereich Halt.'],['lust','Einfach Lust drauf','Völlig in Ordnung. Genuss ist kein Fehler.']];
const HELP = [
  ['TelefonSeelsorge','0800 111 0 111','Rund um die Uhr, kostenlos und anonym. Auch 0800 111 0 222 oder 116 123, Chat auf telefonseelsorge.de.'],
  ['Info-Telefon Depression','0800 33 44 533','Kostenlos. Mo, Di, Do 13–17 Uhr, Mi, Fr 8:30–12:30 Uhr.'],
  ['Beratung bei Essstörungen (BIÖG)','0221 892031','Mo–Do 10–22 Uhr, Fr–So 10–18 Uhr. Kosten wie ein Anruf nach Köln.'],
  ['Akute Gefahr','112','Wenn du dir oder anderen etwas antun könntest, ruf sofort an.']];
function loggedDays(){ return Object.keys(state.days).filter(k=>totals(k).n>0).sort(); }
function longestStreak(){ const set = new Set([...loggedDays(), ...Object.keys(state.checkins), ...state.jokers]); const all = [...set].sort(); let best = 0, cur = 0, prev = null; all.forEach(k=>{ cur = (prev && addDays(prev,1)===k) ? cur+1 : 1; best = Math.max(best,cur); prev = k; }); return best; }
function wins(){
  const out = [], t = today(), ld = loggedDays();
  if (ld.length) out.push([String(ld.length), ld.length===1?'Tag eingetragen':'Tage eingetragen', 'seit '+parseKey(ld[0]).toLocaleDateString('de-DE',{day:'numeric',month:'long'})]);
  const ls = longestStreak(); if (ls>=3) out.push([String(ls),'Tage längste Serie','am Stück drangeblieben']);
  const tr30 = new Set(state.workouts.filter(w=>w.date>addDays(t,-30)).map(w=>w.date)).size; if (tr30) out.push([String(tr30),'Trainings in 30 Tagen', state.workouts.length>tr30?state.workouts.length+' insgesamt':'jedes einzelne zählt']);
  const ws = sortedWeights(); if (ws.length>=2) { const d = ws[ws.length-1].kg - ws[0].kg, goal = state.profile.goal; if ((goal==='lose'&&d<-0.2)||(goal==='gain'&&d>0.2)) out.push([(d>0?'+':'')+fmt(d,1)+' kg','Gewicht','seit '+dayLabel(ws[0].date)]); }
  const ms = [...state.measures].sort((a,b)=>a.date<b.date?-1:1); if (ms.length>=2 && ms[0].bauch && ms[ms.length-1].bauch) { const d = ms[ms.length-1].bauch-ms[0].bauch; if (d<=-0.5) out.push([fmt(d,1)+' cm','Bauchumfang','weniger Bauch, egal was die Waage sagt']); }
  const pr = records().filter(x=>x.before && x.now-x.before>0.5).sort((a,b)=>(b.now-b.before)-(a.now-a.before))[0]; if (pr) out.push(['+'+fmt(pr.now-pr.before,1)+' kg', pr.name, 'stärker als vor einem Monat']);

/* Open Food Facts */
function offToFood(p, code){
  const n = p.nutriments || {}; const kcal = n['energy-kcal_100g'] ?? (n['energy_100g'] ? n['energy_100g']/4.184 : null);
  if (kcal==null) return null;
  const name = (p.product_name_de || p.product_name || '').trim(); if (!name) return null;
  const brand = (p.brands||'').split(',')[0].trim();
  return {id:'off:'+(code||p.code), name: brand ? name+' · '+brand : name, kcal:Math.round(kcal), p:+(n.proteins_100g||0), c:+(n.carbohydrates_100g||0), f:+(n.fat_100g||0), portion: p.serving_quantity ? Math.round(+p.serving_quantity) : null, barcode: code||p.code||'', src:'off'};
}
const OFF_FAIL = 'Open Food Facts ist gerade nicht erreichbar. In der Vorschau ist das Internet für die App gesperrt, in deiner installierten Version funktioniert es.';
async function offSearch(){
  const q = ($('#foodq')?.value||'').trim(); const box = $('#offres');
  if (!q) { toast('Gib zuerst einen Suchbegriff ein'); return; }
  box.innerHTML = '<div class="empty">Suche läuft …</div>';
  try {
    const r = await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=20&fields=code,product_name,product_name_de,brands,nutriments,serving_quantity&search_terms=' + encodeURIComponent(q));
    const j = await r.json(); const foods = (j.products||[]).map(p=>offToFood(p,p.code)).filter(Boolean);
    ui.sheet.online = foods;
    box.innerHTML = foods.length ? '<div class="eyebrow" style="padding-top:4px">Open Food Facts</div>' + foods.map(foodRow).join('') : '<div class="empty">Keine Treffer bei Open Food Facts.</div>';
  } catch(e) { box.innerHTML = `<div class="note">${OFF_FAIL}</div>`; }
}
async function lookupCode(code){
  code = String(code||'').replace(/\D/g,'');
  if (code.length < 6) { toast('Die Barcode-Nummer ist zu kurz'); return; }
  const own = state.foods.find(f=>f.barcode===code);
  if (own) { ui.sheet.food = own; ui.sheet.grams = null; return drawAmount(); }
  const msg = $('#scanmsg'); if (msg) msg.textContent = 'Suche Produkt ' + code + ' …';
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=code,product_name,product_name_de,brands,nutriments,serving_quantity');
    const j = await r.json(); const f = j.status===1 ? offToFood(j.product, code) : null;
    if (f) { if (!state.foods.find(x=>x.id===f.id)) state.foods.unshift(f); save(); ui.sheet.food = f; ui.sheet.grams = null; return drawAmount(); }
    ui.sheet.mode = 'own'; ui.sheet.prefillCode = code; drawAdd(); toast('Produkt nicht gefunden. Leg es einmal selbst an.');
  } catch(e) { if (msg) msg.textContent = OFF_FAIL; ui.sheet.mode = 'own'; ui.sheet.prefillCode = code; setTimeout(()=>{ if(ui.sheet && ui.sheet.kind==='food'){ drawAdd(); toast('Offline: Produkt einmal selbst anlegen'); } }, 1600); }
}

/* Übungsbibliothek */
function openLib(browse){ ui.sheet = {kind:'lib', browse:!!browse}; drawLib(); }
function drawLib(){
  const chips = `<div class="chips"><button type="button" class="chip" aria-pressed="${!ui.libMuscle}" data-act="libMuscle" data-m="">Alle</button>${MUSCLE_FILTER.map(m=>`<button type="button" class="chip" aria-pressed="${ui.libMuscle===m}" data-act="libMuscle" data-m="${m}">${MUSCLE[m]}</button>`).join('')}</div>`;
  openSheet(ui.sheet.browse && !state.active ? 'Übungsbibliothek' : 'Übung hinzufügen', `<label class="f" for="exq">Übung suchen<input class="input" id="exq" data-bind="exq" value="${esc(ui.libQ)}" placeholder="z. B. Bankdrücken, Squat, Curl" autocomplete="off"></label>${chips}<div id="libres" class="list">${libResults()}</div>`);
}
function libResults(){
  const q = ui.libQ.trim().toLowerCase();
  let list = EXERCISES.filter(e => (!ui.libMuscle || (e.m||[]).includes(ui.libMuscle)) && (!q || (e.d||'').toLowerCase().includes(q) || e.n.toLowerCase().includes(q)));
  list.sort((a,b)=> (b.d?1:0)-(a.d?1:0) || exName(a).localeCompare(exName(b),'de'));
  const total = list.length; list = list.slice(0,60);
  const rows = list.map(e=>`<button type="button" class="item" data-act="pickEx" data-id="${esc(e.i)}">${e.p?`<img class="thumb" loading="lazy" alt="" src="${IMG_BASE+esc(e.p)}" onerror="this.removeAttribute('src')">`:`<span class="thumbph">${I.dumb(22)}</span>`}<div class="grow"><div class="t">${esc(exName(e))}</div><div class="s">${esc((e.m||[]).map(m=>MUSCLE[m]||m).join(', '))} · ${esc(EQUIP[e.e]||e.e)}${e.d?'':' · englisch'}</div></div><span class="gold">${I.plus(20)}</span></button>`).join('');
  return (rows || '<div class="empty">Keine Übung gefunden.</div>') + (total>60?`<div class="empty">${fmt(total-60)} weitere Treffer. Such genauer.</div>`:'');
}
function lastSetsFor(exId){ const ws = [...state.workouts].sort((a,b)=>a.date<b.date?1:-1); for (const w of ws) { const x = w.ex.find(e=>e.exId===exId); if (x && x.sets.length) return x.sets.map(s=>({kg:s.kg,reps:s.reps,done:false})); } return null; }
function newExBlock(id, sets=3, reps=''){ return {exId:id, name:exName(EXBY[id]), sets: lastSetsFor(id) || Array.from({length:sets},()=>({kg:'',reps:reps,done:false}))}; }
function startWorkout(name, list){ const n = new Date(); state.active = {id:uid(), date:today(), start:pad(n.getHours())+':'+pad(n.getMinutes()), name, ex: list.filter(x=>EXBY[Array.isArray(x)?x[0]:x]).map(x=>Array.isArray(x)?newExBlock(x[0],x[1],x[2]):newExBlock(x))}; save(); ui.tab = 'training'; ui.training = 'training'; ui.confirm = null; closeSheet(); render(); $('#view').scrollTop = 0; }
function findTpl(id){ return BUILTIN_TPL.find(t=>t.id===id) || state.templates.find(t=>t.id===id); }

/* Mobility-Player */
let player = null;
function startMob(id){
  const r = MOBILITY.find(m=>m.id===id); if (!r) return; stopPlayer();
  player = {r, i:0, left:r.ex[0][1], run:true, t:setInterval(tickPlayer,1000)};
  ui.sheet = {kind:'player'}; drawPlayer();
}
function tickPlayer(){ if (!player || !player.run) return; player.left--; if (player.left<=0) { if (navigator.vibrate) navigator.vibrate(60); nextStep(1); return; } const b = $('#plbig'); if (b) b.textContent = player.left; }
function nextStep(d){ const p = player; p.i += d; if (p.i<0) p.i = 0;
  if (p.i>=p.r.ex.length) { state.mobility.push({date:today(), id:p.r.id}); save(); const name = p.r.name; stopPlayer(); ui.sheet = {kind:'done'};
    openSheet('Geschafft', `<div class="player"><div class="gold">${I.check(64)}</div><h2>${esc(name)}</h2><div class="muted">Gut gemacht. Das zählt für deine Serie und Challenges.</div><button type="button" class="btn primary block" data-act="closeSheet">Fertig</button></div>`); return; }
  p.left = p.r.ex[p.i][1]; drawPlayer(); }
function stopPlayer(){ if (player) clearInterval(player.t); player = null; }
function drawPlayer(){
  const p = player, [id] = p.r.ex[p.i], e = EXBY[id], nx = p.r.ex[p.i+1];
  openSheet(p.r.name, `<div class="player"><div class="eyebrow">Übung ${p.i+1} von ${p.r.ex.length}</div>
  ${e?.p?`<img src="${IMG_BASE+esc(e.p)}" alt="" onerror="this.removeAttribute('src')">`:''}
  <h2>${esc(exName(e))}</h2><div class="big" id="plbig">${p.left}</div><div class="small muted">Sekunden · einseitige Übungen: halbe Zeit pro Seite</div>
  <div class="row" style="width:100%"><button type="button" class="btn" style="flex:1" data-act="plPrev" ${p.i?'':'disabled'}>Zurück</button><button type="button" class="btn dark" style="flex:1" data-act="plToggle">${p.run?I.pause(18)+' Pause':I.play(18)+' Weiter'}</button><button type="button" class="btn" style="flex:1" data-act="plNext">Nächste</button></div>
  ${nx?`<div class="small muted">Danach: ${esc(exName(EXBY[nx[0]]))}</div>`:''}</div>`);
}

    if (!ex.length) { toast('Hake mindestens einen Satz ab'); return; }
    state.workouts.push({id:a.id, date:a.date, name:a.name||'Training', ex}); state.active = null; save(); render(); toast('Training gespeichert. Stark!'); },
  saveTemplate: () => { const a = state.active; if (!a.ex.length) { toast('Füge zuerst Übungen hinzu'); return; } state.templates.push({id:uid(), name:a.name||'Vorlage', ex:a.ex.map(x=>x.exId)}); save(); toast('Als Vorlage gespeichert'); },
  askDiscard: () => { ui.confirm = 'discard'; render(); },
  discardWorkout: () => { state.active = null; ui.confirm = null; save(); render(); toast('Training verworfen'); },
  cancelConfirm: () => { ui.confirm = null; render(); },
  startMob: b => startMob(b.dataset.id),
  plToggle: () => { player.run = !player.run; drawPlayer(); }, plNext: () => nextStep(1), plPrev: () => nextStep(-1),
  saveWeight: () => { const kg = num($('#wkg').value); if (kg<30||kg>300) { toast('Bitte ein gültiges Gewicht eingeben'); return; } const t = today(); state.weights = state.weights.filter(w=>w.date!==t); state.weights.push({date:t, kg}); state.profile.weight = kg; save(); render(); toast('Gewicht gespeichert'); },
  delWeight: b => { state.weights = state.weights.filter(w=>w.date!==b.dataset.date); save(); render(); },
  saveMeasure: () => { const m = {date:today()}; let any = false; MEASURES.forEach(([k])=>{ const v = num($('#ms-'+k).value); if (v>0){ m[k]=v; any=true; } }); if (!any) { toast('Trag mindestens einen Wert ein'); return; } state.measures = state.measures.filter(x=>x.date!==m.date); state.measures.push(m); save(); render(); toast('Umfänge gespeichert'); },
  delPhoto: async b => { try { await PhotoDB.del(b.dataset.id); } catch(e){} fillPhotos(); },
  remToggle: b => { const k = b.dataset.k; state.remind[k].on = !state.remind[k].on; save(); b.setAttribute('aria-checked', String(state.remind[k].on)); },
  askNotify: async () => { try { await Notification.requestPermission(); } catch(e){} render(); },
  toggleKcal: () => { state.profile.hideKcal = !state.profile.hideKcal; save(); render(); },
  shareReport: async () => { const text = weekReport(); try { if (navigator.share) { await navigator.share({text}); return; } } catch(e){ if (e && e.name==='AbortError') return; } actions.copyReport(); },
  copyReport: async () => { const t = $('#report'); try { await navigator.clipboard.writeText(t.value); toast('Wochenbericht kopiert'); } catch(e) { t.focus(); t.select(); toast('Text markiert, jetzt kopieren'); } },
  askReset: () => { ui.confirm = 'reset'; render(); },
  resetAll: () => { state = blank(); ui.confirm = null; save(); ui.onboard = true; render(); toast('Alle Daten gelöscht'); },
  exportData: () => { const json = JSON.stringify(state); openSheet('Backup', `<div class="small muted">Kopiere den Text und speichere ihn, z. B. in deinen Notizen. Fotos sind nicht enthalten.</div><textarea class="input mono" id="exportbox" aria-label="Backup" readonly>${esc(json)}</textarea><div class="row"><button type="button" class="btn primary" style="flex:1" data-act="copyExport">Kopieren</button><button type="button" class="btn" style="flex:1" data-act="downloadExport">Als Datei</button></div>`); },
  copyExport: async () => { const t = $('#exportbox'); try { await navigator.clipboard.writeText(t.value); toast('Backup kopiert'); } catch(e) { t.focus(); t.select(); toast('Text markiert, jetzt kopieren'); } },
  downloadExport: () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'})); a.download = 'kompass-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); } catch(e){} toast('Falls nichts passiert: Kopieren nutzen'); },
  importOpen: () => openSheet('Backup einspielen', `<div class="small muted">Füge hier den Text aus deinem Backup ein. Die aktuellen Daten werden ersetzt.</div><textarea class="input mono" id="importbox" aria-label="Backup-Text" placeholder="{&quot;v&quot;:1, …}"></textarea><button type="button" class="btn primary block" data-act="doImport">Einspielen</button>`),
  doImport: () => { try { const d = JSON.parse($('#importbox').value); if (!d || d.v!==1 || !d.profile) throw 0; state = migrate(d); save(); closeSheet(); render(); toast('Backup eingespielt'); } catch(e) { toast('Das ist kein gültiges Backup'); } }
};

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = actions[b.dataset.act]; if (f) { e.preventDefault(); f(b); } });
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.bind; if (!k) return;
  if (k==='foodq') $('#foodres').innerHTML = foodResults(t.value);
  else if (k==='exq') { ui.libQ = t.value; $('#libres').innerHTML = libResults(); }
  else if (k==='grams') { ui.sheet.grams = t.value; updateAmountSum(); }
  else if (k==='set') { const s = state.active.ex[t.dataset.x].sets[t.dataset.s]; s[t.dataset.k] = t.value.replace(',','.'); save(); }
  else if (k==='wname') { state.active.name = t.value; save(); }
  else if (k==='foodsq') { ui.foodsQ = t.value; const q = t.value.trim().toLowerCase(); $('#foodslist').innerHTML = foodsList(state.foods.filter(f=>!q || f.name.toLowerCase().includes(q) || (f.barcode||'').includes(q))); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.bind; if (!k) return;
  if (k==='profile') { const key = t.dataset.k; let v = t.value;
    if (['age','height','waterGoal','weekGoal'].includes(key)) v = Math.round(num(v)); else if (key==='activity') v = Number(v); else if (key==='weight') v = num(v);
    if (key==='weight' && v>=30 && v<=300) { const d = today(); state.weights = state.weights.filter(w=>w.date!==d); state.weights.push({date:d,kg:v}); }
    state.profile[key] = v; save(); render(); }
  else if (k==='scanfile') scanFile(t.files && t.files[0]);
  else if (k==='photo') { addPhoto(t.files && t.files[0]); t.value = ''; }
  else if (k==='set') render();
  else if (k==='workmode') { state.work.mode = t.value; save(); toast('Gespeichert'); }
  else if (k==='shiftTime') { if (t.value) { state.work.times[t.dataset.s][Number(t.dataset.i)] = t.value; save(); } }
  else if (k==='remEvery') { state.remind[t.dataset.k].every = Number(t.value); save(); }
  else if (k==='remTime') { if (t.value) { state.remind.checkin.time = t.value; save(); } }
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#sheet').hidden) { closeSheet(); render(); } if (e.key!=='Enter') return; const id = e.target.id; if (id==='barcode') lookupCode(e.target.value); else if (id==='foodq') offSearch(); else if (id==='habitname') actions.addHabit(); else if (id==='extraname') actions.extraAdd(); });

/* Erinnerungen, solange die App offen ist */
const fired = {};
function notify(title, body){ toast(title + ': ' + body); try { if (typeof Notification!=='undefined' && Notification.permission==='granted' && navigator.serviceWorker?.controller) navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png'})); } catch(e){} }
function reminderTick(){
  const r = state.remind, k = today(), n = nowH(), sh = shiftOf(k), mins = Math.floor(Date.now()/60000);
  let from = 9, to = 18; if (sh!=='frei') { from = hToNum(state.work.times[sh][0]); to = hToNum(state.work.times[sh][1]); if (to<=from) to += 24; }
  const inWork = (n>=from && n<=to) || (n+24>=from && n+24<=to);
  if (r.move.on && inWork && mins % r.move.every === 0 && fired.move!==mins) { fired.move = mins; notify('Bewegungspause','2 Minuten aufstehen und strecken.'); }
  if (r.water.on && mins % r.water.every === 0 && fired.water!==mins) { const exp = state.profile.waterGoal*Math.max(0,Math.min(1,(n-7)/14)); if ((day(k).water||0) < exp-500) { fired.water = mins; notify('Trinken','Du liegst etwas hinter deinem Wasserziel.'); } }
  if (r.checkin.on && !state.checkins[k] && fired.ci!==k && n>=hToNum(r.checkin.time) && n<hToNum(r.checkin.time)+0.1) { fired.ci = k; notify('Abend-Check','Wie war dein Tag? Dauert 30 Sekunden.'); }
}

/* ================= Start ================= */
let loaded = load();
if (loaded && loaded.sample && !loaded.habits.length) loaded = null; /* alte Beispieldaten aus Phase 1 ersetzen */
if (loaded) state = loaded; else { state = blank(); ui.onboard = true; }
if (!state.sample && !state.weights.length && !Object.keys(state.days).length) ui.onboard = true;
save();
render();
setInterval(reminderTick, 30000);
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
